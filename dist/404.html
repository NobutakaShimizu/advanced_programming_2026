<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    (function () {
      var base = '/advanced_programming_2026';
      var path = location.pathname;
      if (!path.startsWith(base)) {
        location.replace(base + '/');
        return;
      }
      var rest = path.slice(base.length);
      var match = rest.match(/^\/(guidance|lec\d+)\/?(.*)$/);
      if (match) {
        var pkg = match[1];
        var slide = (match[2] || '').replace(/\/$/, '');
        var hash = slide ? '#/' + slide : '';
        location.replace(base + '/' + pkg + '/' + hash + location.search);
        return;
      }
      location.replace(base + '/');
    })();
  </script>
</head>
<body></body>
</html>
